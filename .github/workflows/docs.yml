name: Deploy docs

on:
  push:
    branches:
      - main
  # Rebuild after each release so the version shown in the header refreshes.
  release:
    types: [published]
  workflow_dispatch:

# Published with GitHub Pages' own deployment (repository settings > Pages >
# Source: GitHub Actions), not by pushing a gh-pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install "zensical>=0.0.72" "mkdocstrings[python]>=0.24" .

      - name: Build
        run: zensical build --clean

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
