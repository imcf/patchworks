name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.18"
          args: "check"

      - name: ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.18"
          args: "format --check"

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  docs:
    # The deploy workflow only runs on main; catch a broken reference or a
    # docstring mkdocstrings cannot render before it gets there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install "mkdocs-material>=9.0" "mkdocstrings[python]>=0.24" .

      - name: mkdocs build --strict
        run: mkdocs build --strict
