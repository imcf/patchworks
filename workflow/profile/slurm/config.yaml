# Snakemake 8+ SLURM profile for the patchworks workflow.
# Needs: pip install "patchworks[workflow]"  (snakemake + slurm executor plugin)
# Run:   snakemake --workflow-profile profile/slurm --configfile config/config.yaml
#
# Edit the partitions / account / GPU request for your cluster.

executor: slurm
# The SLURM executor names every job after its run UUID and rejects a
# --job-name in slurm_extra, so `squeue` shows nothing recognisable without
# this. The prefix goes first in the name (<prefix>_<uuid>), which is the part
# that survives truncation in a queue listing.
# Alphanumerics, underscores and hyphens only; 50 characters max.
# run_multi overrides this per config, so a three-way run shows pw-convert,
# then pw-nuclei_labels / pw-cyto_labels / pw-cilia_labels.
slurm-jobname-prefix: patchworks
# Max concurrent SLURM jobs Snakemake will have in flight at once. This is a
# submission-side cap, not a cluster limit — raising it just lets more
# "segment" tiles queue/run together; scicore's scheduler still enforces your
# real GPU quota (MaxTRESPU) and backfills the rest, so it's safe to raise.
# Check your actual per-user GPU cap with:
#   sacctmgr show assoc user=$USER format=account,partition,maxjobs,GrpTRES
#
# NOTE: this is per Snakemake process. run_multi.py runs the segmentation
# configs concurrently, so a 3-config multi run can have up to 3 x this many
# jobs in flight.
jobs: 128
latency-wait: 60
rerun-incomplete: true
# Only re-run when an output is missing/stale — NOT when the patchworks code,
# params or software env change. Stops an upgrade from re-doing the expensive
# conversion / re-segmenting an existing image.zarr.
rerun-triggers: mtime
printshellcmds: true
keep-going: true
# Retry a failed job twice, asking for more memory each time (see the
# attempt-scaled mem_mb below). A transient OOM or a node hiccup then costs a
# resubmission instead of failing the run and requiring a manual rerun.
retries: 2

# Defaults for every rule (CPU jobs).
default-resources:
  slurm_partition: "scicore"
  # slurm_account: "my_account"
  mem_mb: 16000
  cpus_per_task: 4
  runtime: 60 # minutes

# Per-rule overrides.
set-resources:
  convert:
    # convert.py pins dask's threaded scheduler to cpus_per_task, so this
    # scales conversion without the scheduler quietly running one worker per
    # *machine* core. Verify actual scaling with `seff <jobid>` after a run
    # and dial back if efficiency is low (scicore fair-share asks you not to
    # sit on idle cores).
    mem_mb: "attempt * 64000"
    cpus_per_task: 32
    runtime: 360
  occupancy:
    # One streaming pass over the whole image, max-pooling each brick. Reads a
    # lot but holds little: memory is bounded by the worker count times one
    # region, not by the image. Runtime tracks the read, so give it room --
    # this is a multi-terabyte scan on a real dataset.
    mem_mb: "attempt * 32000"
    cpus_per_task: 16
    runtime: 360
  prepare:
    # Cheap now: it reduces the already-built occupancy map over each tile's
    # footprint instead of touching the image.
    #
    # tile_shape: "auto" now also sizes against a host-RAM budget, and it
    # reads *this job's* grant as a stand-in for segment's -- prepare runs on
    # a CPU node and can't query segment's GPU-node grant directly. Keep this
    # equal to segment's mem_mb below: lower and tiles come out needlessly
    # small; higher and the sizer budgets against more host RAM than segment
    # will actually get, undoing the point of the host-RAM check.
    mem_mb: "attempt * 32000"
    runtime: 120
  segment:
    # one GPU per job — this is what spreads Cellpose across GPUs.
    # Use the plugin's native `gres` resource → emits --gres=gpu:1, which is
    # how scicore binds a CUDA device. (The `gpu:` resource emits --gpus and
    # leaves the job without a device.)
    slurm_partition: "rtx4090"
    gres: "gpu:1"
    qos: "rtx4090-6hours" # scicore: <partition>-<duration> QOS
    # A job now processes `tiles_per_job` tiles sequentially, so both memory
    # and runtime scale with that setting — raise it there and re-check here.
    # The old "a tile used ~1G" note predates tile_shape: "auto", which sizes
    # tiles against the real GPU and makes them far bigger. If you raise
    # this, raise prepare's mem_mb above to match (see its comment).
    mem_mb: "attempt * 32000"
    cpus_per_task: 4
    runtime: 360 # 6 hours — must match the QOS, NOT 120 (=2h → killed early)
  merge:
    # merge.py sizes its worker pool from the cgroup/SLURM budget rather than
    # the node's core count, and the pyramid is written zarr-natively (one
    # source chunk per task) instead of through a dask rechunk — so this no
    # longer has to cover an unbounded scheduler.
    mem_mb: "attempt * 64000"
    cpus_per_task: 32
    runtime: 240
