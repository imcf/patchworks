# SLURM profile: `pixi run slurm` / `multi-slurm` use it.
# Adapt the partitions, QOS and GPU request to your cluster.

executor: slurm
slurm-jobname-prefix: patchworks # run_multi sets one per segmentation
jobs: 128 # jobs in flight per Snakemake process; the cluster enforces your quota
latency-wait: 60
rerun-incomplete: true
rerun-triggers: mtime # an upgrade does not redo finished steps
printshellcmds: true
keep-going: true
retries: 2 # memory grows with each attempt (mem_mb below)

# Each `runtime` must fit the QOS the job lands in, or sbatch refuses it
# (QOSMaxWallDurationPerJobLimit) and the job never starts. scicore's default
# QOS allows 6 h; for longer, set a `qos:` as segment does. What you may use:
#   sacctmgr show assoc user=$USER format=partition,qos%40
#   sacctmgr show qos format=name,maxwall
default-resources:
  slurm_partition: "scicore"
  # slurm_account: "my_account"
  mem_mb: 16000
  cpus_per_task: 4
  runtime: 60 # minutes

set-resources:
  convert:
    mem_mb: "attempt * 64000"
    cpus_per_task: 32
    runtime: 360
  occupancy: # one streaming pass over the image
    mem_mb: "attempt * 32000"
    cpus_per_task: 16
    runtime: 360
  prepare:
    # Keep equal to segment's mem_mb: tile_shape "auto" sizes tiles to it.
    mem_mb: "attempt * 128000"
    runtime: 120
  segment:
    slurm_partition: "rtx4090"
    gres: "gpu:1" # one GPU per job (`gpu:` would leave the job without one)
    qos: "rtx4090-1day"
    # Memory and time cover `tiles_per_job` tiles; a whole-z 3-D tile can
    # take several hours.
    mem_mb: "attempt * 128000"
    cpus_per_task: 4
    runtime: 1400 # under the QOS's 24 h
  merge:
    mem_mb: "attempt * 64000"
    cpus_per_task: 32
    runtime: 240
