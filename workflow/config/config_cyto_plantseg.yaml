# Example segmentation config: cells from a membrane stain, with PlantSeg's
# boundary U-Net flooded from the nuclei -- one cell per nucleus. See
# docs/guide/membrane_cells.md. Used by config/multi_plantseg.yaml.
#
# Needs the plantseg environment (PlantSeg is on conda-forge only):
#
#   pixi install -e plantseg
#   pixi run -e plantseg plantseg-fetch generic_confocal_3D_unet  # once, with internet
#
# Only what differs from config/common.yaml, as for the other configs.

channel: 0 # membrane channel
# Stacked onto each tile as [membrane, nuclei]: the nuclei are the seeds.
# Only this step reads it, so the labels stay comparable with the nuclei run.
nuclei_channel: 1

# The halo must hold a whole cell: a cell cut by the tile edge has no seed
# in the tile next door. [z, y, x], like the other configs.
overlap: [4, 40, 40]

method: "custom"
label_name: "cyto_labels"
custom:
  module: "patchworks.plugins.plantseg"
  function: "segment"
  kwargs:
    # PlantSeg zoo U-Net predicting cell boundaries. Each tile is resampled
    # to the voxel size it was trained at (from the image's calibration).
    # generic_light_sheet_3D_unet for light-sheet data.
    model: "generic_confocal_3D_unet"
    # The U-Net's boundaries flooded from the nuclei. Alternatives:
    # "lifted_multicut" (also uses the nuclei), or "gasp" (no nuclei).
    segmentation: "nuclei_watershed"
    # Where the nuclei are, in the nuclear channel: Otsu per tile, holes
    # filled, specks below nuclei_min_size voxels dropped. Set
    # nuclei_threshold (an intensity) if Otsu misses dim nuclei or joins
    # touching ones -- two nuclei as one seed give one cell for two.
    nuclei_min_size: 200
    # nuclei_threshold: 800
    # A boundary U-Net sees cells everywhere: keep the tissue only.
    foreground: "otsu"
    # max_radius_um: 15 # and/or: no further than this from the nucleus
    device: "cuda"

# min_volume: 100.0 # optional: drop cells smaller than this many µm³
