# Drives `pixi run multi` / `scripts/run_multi.py`: runs several segmentation
# configs (in order) against the same work_dir, then relates their labels by
# voxel overlap (patchworks.label_relations) and writes an Excel workbook per
# pair (two sheets: one row per a-object incl. unmatched ones, one row per
# b-object incl. ones with zero matches — see docs/guide/snakemake.md).
#
# All listed segmentation configs must share the same work_dir/image.zarr and
# the same tile_shape/level, so the resulting label arrays are directly
# comparable — see docs/guide/snakemake.md "Running two segmentations".
#
# Both lists are plain lists: 3+ segmentations work the same way — add more
# entries to `segmentations`, then list whichever pairs you want related in
# `relations` (there's no automatic "chain"; list every pair explicitly, e.g.
# nuclei->cyto, nuclei->membrane, cyto->membrane).

# Settings every segmentation shares — the input, the work_dir, the tiling,
# everything `convert` reads. Merged in ahead of each config below, so a
# per-config file carries only what differs. Optional: drop this line and each
# config can be self-contained again.
common: config/common.yaml

segmentations:
- config/config_nuclei.yaml
- config/config_cyto.yaml
- config/config_cilia.yaml

# SLURM settings for the relate step under --profile. Optional: omit the block
# and the defaults below apply. They live here rather than only as --relate-*
# flags so `pixi run multi-slurm` -- a fixed command -- still works on a
# cluster whose default QOS caps the wall time below `time`. A --relate-*
# flag overrides whatever is set here.
#
# `time` bounds ONE relation (each pair is its own job), and must stay under
# the MaxWall of `qos`, or srun refuses the job before it starts. List what
# you may use with:
#   sacctmgr show assoc user=$USER format=partition,qos%40
#   sacctmgr show qos format=name,maxwall
# relate:
#   partition: "scicore"   # default: scicore
#   mem: "32G"             # default: 32G
#   cpus: 8                # default: 8
#   time: 180              # minutes, per pair; default: 180
#   qos: "1day"            # default: your account's default QOS

relations:
- a: nuclei_labels
  b: cyto_labels
  output: nuclei_to_cyto.xlsx
- a: cilia_labels
  b: cyto_labels
  output: cilia_to_cell.xlsx
- a: cilia_labels
  b: nuclei_labels
  output: cilia_to_nucleus.xlsx
