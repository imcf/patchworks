# Several segmentations of one image, and how they relate.
#   pixi run multi-dry   --config this.yaml
#   pixi run multi-slurm --config this.yaml

common: config/common.yaml

segmentations:
- config/config_nuclei.yaml
- config/config_cyto.yaml
- config/config_cilia.yaml

# One workbook per pair: each a's b, and how many a each b holds.
relations:
- a: nuclei_labels
  b: cyto_labels
  output: nuclei_to_cyto.xlsx
- a: cilia_labels
  b: cyto_labels
  output: cilia_to_cell.xlsx
  max_distance_um: 1.0 # a cilium touching no cell gets the nearest one

# What `patchworks review` flags.
# review:
#   expect:
#     cyto_labels:
#       nuclei_labels: 1 # or [min, max]

# SLURM settings of the relate and zip jobs.
# relate:
#   qos: "1day"
#   mem: "32G"

# The store is zipped at the end.
# bundle: false
