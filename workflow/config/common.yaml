# Settings shared by every segmentation in multi.yaml.
# Anything not set here or in a segmentation's config has a default
# (all settings: docs/guide/snakemake.md).

input: "/path/to/scan.ims" # .ims .czi .lif .nd2 OME-TIFF .zarr, or a TIFF glob
work_dir: "/path/to/results" # everything is written here
tile_shape: [16, 1024, 1024] # the same for every segmentation; "auto" sizes it
# notify_email: "you@example.org" # mail when the run finishes or fails
