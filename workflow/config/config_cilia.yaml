# Cilia: deconvolution, then difference of Gaussians. Needs a GPU.

label_name: "cilia_labels"
channel: 2
overlap: [8, 30, 30] # covers the PSF and high_sigma
method: "custom"
custom:
  module: "patchworks.plugins.dog"
  kwargs:
    low_sigma: 1.0 # pixels
    high_sigma: 3.0
    threshold: 0.05 # fraction of the channel's intensity range
    connectivity: 3 # keep oblique cilia whole
    # sigma_units: "px" # or "um": sigmas in micrometres
    # use_gpu: false    # blur and label on the GPU (needs cupy)
    # intensity_range: null # [low, high] the threshold is a fraction of; null: measured
    decon_kwargs: # remove to skip deconvolution; voxel sizes come from the image
      psf: "/path/to/psf.tif"
      wavelength: 525
      na: 1.4
      nimm: 1.515
max_volume: 10 # µm³: a cilium is ~1; larger is texture joined up

# ---- every other setting of this segmentation, with its default ----------
# stitch: "touch"         # join pieces touching across a seam; "iou": only where both tiles agree
# iou_threshold: 0.5      # with "iou": overlap needed, of the smaller piece
# skip_empty: true        # skip tiles without signal
# empty_threshold: null   # their cutoff, in intensity; null: Otsu of the channel
# nuclei_channel: null    # a second channel (Cellpose, watershed, PlantSeg)
# seed_labels: null       # or grow from a label image another config made
# denoise: null           # {model: "n2v.ckpt"}: Noise2Void first (careamics environment)
# normalize: "image"      # Cellpose: one intensity range for every tile; "tile": per tile
# connectivity: 1         # 3: also join voxels touching at edges and corners
# fill_holes: false       # true, or "per_plane"
# open_radius: 0          # cut thin spurs (not for cilia)
# dilate: 0               # grow labels by N pixels
# dilate_gpu: false
# min_volume: null        # µm³: drop smaller objects
# sequential_labels: true # number objects 1..N
# object_table: true      # one row per object, stored with the labels
# table_channels: []      # add mean/std intensity of these channels
