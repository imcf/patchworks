# Nuclei with Cellpose, then cells with PlantSeg grown from them.
#   pixi run -e plantseg multi-plantseg-slurm

common: config/common.yaml

segmentations:
- config/config_nuclei.yaml
- config/config_cyto_plantseg.yaml

relations:
- a: nuclei_labels
  b: cyto_labels
  output: nuclei_to_cyto.xlsx

review:
  expect:
    cyto_labels:
      nuclei_labels: 1
