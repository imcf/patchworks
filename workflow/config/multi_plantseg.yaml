# Nuclei with Cellpose, then cells with PlantSeg grown from exactly those
# nuclei (seed_labels), related to each other -- one command. The cells'
# config waits for the nuclei's to finish; anything else listed here runs
# alongside. See docs/guide/membrane_cells.md.
#
#   cd workflow
#   pixi install -e plantseg
#   pixi run -e plantseg plantseg-fetch generic_confocal_3D_unet  # once, with internet
#   pixi run -e plantseg multi-plantseg-dry
#   pixi run -e plantseg multi-plantseg-slurm
#
# The plantseg environment is the default one plus PlantSeg, so Cellpose
# runs from it too. Everything else works as in config/multi.yaml, which
# documents the optional relate:, review: and bundle: blocks.

common: config/common.yaml

segmentations:
- config/config_nuclei.yaml # Cellpose "nuclei" model on channel 1
- config/config_cyto_plantseg.yaml # PlantSeg on channel 0, seeded by nuclei_labels

relations:
- a: nuclei_labels
  b: cyto_labels
  output: nuclei_to_cyto.xlsx

# One nucleus per cell is what the seeding promises; `patchworks review`
# flags any cell where that does not hold (a nucleus outside the tissue
# mask, a cell dropped by min_volume).
review:
  expect:
    cyto_labels:
      nuclei_labels: 1
