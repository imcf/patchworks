# Cells with Cellpose, the nuclear stain as its second input.
# With a membrane stain, see docs/guide/membrane_cells.md.

label_name: "cyto_labels"
channel: 0 # cytoplasm or membrane
nuclei_channel: 1 # null: one channel only
overlap: [4, 30, 30]
cellpose:
  model: "cyto3" # Cellpose 4: "cpsam"
  diameter: 30
  do_3D: true
