# Cells (cytoplasm or membrane). Only what differs from common.yaml.

channel: 0 # cytoplasm or membrane
nuclei_channel: 1 # Cellpose's second input; null for one channel
overlap: [4, 30, 30]
method: "cellpose"
label_name: "cyto_labels"
# min_volume: 100.0 # µm³
cellpose:
  model: "cyto3"
  diameter: 30
  do_3D: true
  gpu: true

# With a membrane stain, Cellpose 4 (cpsam) may segment the nuclei instead of
# the cells. One cell per nucleus instead (docs/guide/membrane_cells.md):
# method: "custom"
# stitch: "iou"
# custom:
#   module: "patchworks.plugins.watershed"   # or patchworks.plugins.plantseg
#   kwargs: {foreground: "otsu"}
