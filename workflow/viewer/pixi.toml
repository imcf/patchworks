# A pixi workspace for *viewing* results -- separate from ../pixi.toml on
# purpose.
#
#   cd workflow/viewer
#   pixi install
#   pixi run napari /path/to/image.zarr
#   pixi run napari /path/to/image.zarr.zip      # a `pixi run zip` bundle
#   pixi run review /path/to/image.zarr          # check and correct objects
#
# Why a second manifest rather than an environment in the first one: the
# workflow manifest needs cudadecon and the GPU segmentation stack, which
# are built for linux-64 only. A platform declared anywhere in a manifest --
# on the workspace or on a single feature -- goes into the set pixi solves
# *every* environment in it for, so adding win-64 there makes the GPU
# environments unsolvable. There is no way to exempt one environment.
#
# Nothing here needs a GPU or a cluster, so this one solves on Windows,
# macOS and Linux, and holds only what napari needs.

[workspace]
name = "patchworks-viewer"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"

# This clone's own patchworks: `git pull` updates the viewer too.
[pypi-dependencies]
patchworks = { path = "../..", editable = true, extras = ["napari"] }

[tasks]
# Tasks run with the manifest's directory as cwd, so this reaches the
# viewer script shared with the workflow rather than duplicating it.
napari = "python ../scripts/view.py"
# Look at the likely mistakes one by one and fix them (see the docs'
# "Reviewing and correcting results"). The store must be writable: unzip a
# bundle first, since decisions are saved in it.
review = "patchworks review"
# Where the time goes when napari is slow (chunking, the store's latency,
# decompressing, drawing). Reads only.
bench = "python ../scripts/bench_view.py"
